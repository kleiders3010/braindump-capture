<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Braindump</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg: #17171a; --panel: #222226; --line: #33333a; --text: #ececf0; --dim: #8e8e99;
          --accent: #8b5cf6; --red: #e5484d; --green: #46a758; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  [hidden] { display: none !important; }
  #app, #recording, #setup { position: fixed; inset: 0 0 auto 0; height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  #bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 6px; }
  #bar .tabs { display: flex; gap: 4px; }
  #bar .tabs button { font-weight: 650; color: var(--dim); padding: 6px 10px; border-radius: 10px; }
  #bar .tabs button.on { color: var(--text); background: var(--panel); }
  #qcount { display: inline-block; min-width: 20px; margin-left: 4px; padding: 0 6px; border-radius: 999px; font-size: 12px;
            line-height: 20px; text-align: center; background: var(--accent); color: white; }
  #qcount:empty { display: none; }

  #qview { flex: 1; min-height: 0; overflow: auto; padding: 4px 16px 28px; }
  #qview h2 { font-size: 13px; font-weight: 650; color: var(--dim); margin: 18px 0 8px; }
  #qview .empty { color: var(--dim); text-align: center; margin-top: 48px; }
  .q { background: var(--panel); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .q p { margin: 0; }
  .q .note { font-size: 13px; color: var(--dim); margin-top: 6px; }
  .q.done { opacity: .55; }
  .q textarea { display: block; width: 100%; min-height: 96px; margin-top: 10px; padding: 8px 10px; resize: vertical;
                border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; outline: 0; }
  .q .row { display: flex; gap: 10px; margin-top: 10px; }
  .q .go { flex: 1; height: 46px; border-radius: 12px; background: var(--accent); color: white; font-weight: 650; }
  .q .go:disabled { background: var(--line); color: var(--dim); }
  .q .drop { height: 46px; padding: 0 16px; border-radius: 12px; background: var(--bg); color: var(--dim); }
  #status { font-size: 13px; color: var(--dim); padding: 6px 10px; border-radius: 999px; background: var(--panel); }
  #bar .right { display: flex; gap: 8px; align-items: center; }
  #install { font-size: 13px; font-weight: 650; color: white; padding: 6px 12px; border-radius: 999px; background: var(--accent); }
  #status.warn { color: #ffcf70; }
  #status.bad { color: #ff9b9e; }
  #status.ok { color: var(--green); }

  #text { flex: 1; min-height: 0; width: 100%; resize: none; border: 0; outline: 0; background: transparent;
          color: var(--text); font: inherit; font-size: 18px; padding: 8px 16px 16px; }
  #text::placeholder { color: #5d5d68; }

  #actions { display: flex; gap: 12px; padding: 10px 16px 14px; border-top: 1px solid var(--line); background: var(--bg); }
  #mic { flex: 0 0 64px; height: 56px; border-radius: 16px; background: var(--panel); display: grid; place-items: center; }
  #mic svg { width: 26px; height: 26px; }
  #send { flex: 1; height: 56px; border-radius: 16px; background: var(--accent); color: white; font-weight: 650; font-size: 18px; }
  #send:disabled { background: var(--panel); color: var(--dim); }
  #mic:active, #send:active { filter: brightness(1.2); }

  #recording { background: #2a1214; align-items: center; justify-content: center; gap: 22px; text-align: center; }
  #recording .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--red); display: inline-block;
                    margin-right: 10px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { #recording .dot { animation: none; } }
  #clock { font-size: 56px; font-weight: 650; font-variant-numeric: tabular-nums; }
  #stop { width: 76%; max-width: 340px; height: 84px; border-radius: 24px; background: var(--red); color: white;
          font-size: 22px; font-weight: 650; }
  #discard { color: var(--dim); font-size: 15px; padding: 12px 18px; }

  #setup { padding-left: 22px; padding-right: 22px; justify-content: center; gap: 14px; overflow: auto; }
  #setup h1 { font-size: 24px; margin: 0; }
  #setup p { margin: 0; color: var(--dim); font-size: 15px; }
  #setup label { font-size: 13px; color: var(--dim); display: block; margin-bottom: 4px; }
  #setup input { width: 100%; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
                 color: var(--text); font: inherit; padding: 0 14px; }
  #save { height: 54px; border-radius: 14px; background: var(--accent); color: white; font-weight: 650; }
  #setupMsg { min-height: 22px; font-size: 14px; }
  #cancelSetup { color: var(--dim); font-size: 15px; padding: 8px; }
</style>
</head>
<body>

<main id="app">
  <div id="bar">
    <span class="tabs">
      <button id="tabDump" type="button" class="on">Dump</button>
      <button id="tabQ" type="button">Questions<span id="qcount"></span></button>
    </span>
    <span class="right">
      <button id="install" type="button" hidden>Install</button>
      <button id="status" type="button">&nbsp;</button>
    </span>
  </div>
  <textarea id="text" placeholder="Dump it here…" autocapitalize="sentences" autofocus></textarea>
  <div id="actions">
    <button id="mic" type="button" aria-label="Record a voice dump">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7"/>
      </svg>
    </button>
    <button id="send" type="button" disabled>Send</button>
  </div>
  <div id="qview" hidden></div>
</main>

<section id="recording" hidden>
  <div><span class="dot"></span>Recording</div>
  <div id="clock">0:00</div>
  <button id="stop" type="button">Stop and send</button>
  <button id="discard" type="button">Discard</button>
</section>

<section id="setup" hidden>
  <h1>Connect this phone</h1>
  <p>Paste the access token for your braindump repository. It is stored only on this phone.</p>
  <div><label for="repo">Repository (owner/name)</label><input id="repo" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="owner/braindump"></div>
  <div><label for="token">Access token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_…"></div>
  <button id="save" type="button">Connect</button>
  <div id="setupMsg"></div>
  <button id="cancelSetup" type="button" hidden>Cancel</button>
</section>

<script src="outbox.js"></script>
<script>
const $ = id => document.getElementById(id);
const text = $('text'), send = $('send'), statusEl = $('status');
let swReg = null;

// ---- naming: the PC sorts dumps by these names
let lastStamp = '', sameStamp = 0;
function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const s = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  sameStamp = s === lastStamp ? sameStamp + 1 : 0;  // two files in the same second must not share a name
  lastStamp = s;
  return sameStamp ? `${s}-${sameStamp + 1}` : s;
}

// ---- status + upload
async function refresh(result) {
  const left = (await outboxAll()).length;  // the real count: the background worker may have sent some meanwhile
  const error = result ? result.error : null;
  statusEl.className = '';
  if (error === 'setup' || error === 'token') {
    statusEl.textContent = left ? `${left} waiting · connect phone` : 'Connect phone';
    statusEl.classList.add('bad');
  } else if (left) {
    statusEl.textContent = `${left} waiting` + (error === 'offline' ? ' · offline' : error ? ' · retrying' : ' · sending…');
    statusEl.classList.add('warn');
  } else {
    statusEl.textContent = 'All sent';
    statusEl.classList.add('ok');
  }
  return { left, error };
}

async function kick() {
  await refresh();
  if (swReg && 'sync' in swReg) swReg.sync.register('flush').catch(() => {});  // keeps trying after the app is closed
  return refresh(await flush());
}

statusEl.onclick = async () => {
  const r = await kick();
  if (r.error === 'setup' || r.error === 'token') showSetup(true);
};
addEventListener('online', kick);
document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });
setInterval(async () => { if (!document.hidden && (await outboxAll()).length) kick(); }, 30000);
setInterval(async () => {  // the background worker emptied the queue: say so
  if (!document.hidden && statusEl.classList.contains('warn') && !(await outboxAll()).length) refresh();
}, 4000);

// ---- text dump
text.value = localStorage.getItem('draft') || '';
send.disabled = !text.value.trim();
text.oninput = () => { localStorage.setItem('draft', text.value); send.disabled = !text.value.trim(); };
send.onclick = async () => {
  const body = text.value.trim();
  if (!body) return;
  await outboxAdd({ name: stamp() + ' phone.md', blob: new Blob([body + '\n'], { type: 'text/markdown' }), created: Date.now() });
  text.value = '';
  localStorage.removeItem('draft');
  send.disabled = true;
  text.focus();
  kick();
};

// ---- voice dump: chunks go to disk as they arrive, so a killed app still leaves a usable recording
let recorder = null, stream = null, recT0 = 0, clockTimer = 0, wakeLock = null, discarding = false;
const MIMES = [['audio/webm;codecs=opus', 'webm'], ['audio/mp4', 'm4a'], ['audio/ogg;codecs=opus', 'ogg'], ['audio/webm', 'webm']];

async function saveRecording() {
  const chunks = await recAll(), meta = await kvGet('recmeta');
  if (chunks.length && meta) {
    await outboxAdd({ name: meta.name, blob: new Blob(chunks, { type: meta.mime }), created: Date.now() });
  }
  await recClear();
  await kvDel('recmeta');
}

async function startRec() {
  if (recorder) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    statusEl.textContent = 'Microphone blocked';
    statusEl.className = 'bad';
    return;
  }
  const pick = MIMES.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m[0])) || ['', 'webm'];
  recorder = new MediaRecorder(stream, pick[0] ? { mimeType: pick[0], audioBitsPerSecond: 48000 } : undefined);
  await recClear();
  await kvSet('recmeta', { name: `${stamp()} phone voice.${pick[1]}`, mime: recorder.mimeType || pick[0] });
  let pending = Promise.resolve();
  recorder.ondataavailable = e => { if (e.data && e.data.size) pending = pending.then(() => recAdd(e.data)); };
  recorder.onstop = async () => {
    await pending;
    if (discarding) { await recClear(); await kvDel('recmeta'); } else { await saveRecording(); }
    discarding = false;
    kick();
  };
  recorder.start(2000);
  recT0 = Date.now();
  $('clock').textContent = '0:00';
  clockTimer = setInterval(() => {
    const s = Math.floor((Date.now() - recT0) / 1000);
    $('clock').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }, 500);
  $('recording').hidden = false;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}

function stopRec(discard) {
  if (!recorder) return;
  discarding = !!discard;
  clearInterval(clockTimer);
  recorder.stop();
  stream.getTracks().forEach(t => t.stop());
  recorder = null;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  $('recording').hidden = true;
}

$('mic').onclick = startRec;
$('stop').onclick = () => stopRec(false);
$('discard').onclick = () => { if (confirm('Throw this recording away?')) stopRec(true); };

// ---- connect the phone
function showSetup(canCancel) {
  $('setup').hidden = false;
  $('cancelSetup').hidden = !canCancel;
  kvGet('config').then(c => { if (c) { $('repo').value = c.repo; } });
}
$('cancelSetup').onclick = () => { $('setup').hidden = true; };
$('save').onclick = () => connect($('repo').value.trim(), $('token').value.trim(), 'inbox');

async function connect(repo, token, branch) {
  const msg = $('setupMsg');
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) { msg.textContent = 'Fill in both fields.'; return false; }
  msg.textContent = 'Checking…';
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/branches/${encodeURIComponent(branch)}`,
      { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' } });
    if (!r.ok) { msg.textContent = r.status === 401 ? 'That token is not valid.' : 'The token cannot reach that repository.'; return false; }
  } catch (e) {
    msg.textContent = 'No connection. Saved anyway; it will be checked when you send.';
  }
  await kvSet('config', { repo, token, branch });
  $('token').value = '';
  $('setup').hidden = true;
  msg.textContent = '';
  kick();
  return true;
}

// ---- questions: the PC's open questions about every idea (Questions.md in the repo); an answer travels as a dump
const qview = $('qview'), DAY = 24 * 3600 * 1000;
let qShown = '', qOpen = null;
const qKey = it => it.title + '\n' + it.q;

function parseQuestions(md) {
  const out = [];
  let title = null, cur = null;
  for (const line of md.split('\n')) {
    let m = line.match(/^##\s+\[\[(.+?)\]\]/);
    if (m) { title = m[1]; cur = null; continue; }
    m = line.match(/^- \[(.)\]\s+(.*)/);
    if (m && title) {
      cur = { title, q: m[2].trim(), onPc: m[1].toLowerCase() === 'x' };
      out.push(cur);
    } else if (cur && line.trim()) {
      cur.onPc = true;  // already answered in the note on the PC, waiting to be worked in
    }
  }
  return out;
}

async function renderQuestions(force) {
  const data = await kvGet('questions'), answered = (await kvGet('answered')) || {};
  const items = data ? parseQuestions(data.md) : [];
  const isDone = it => it.onPc || (answered[qKey(it)] && Date.now() - answered[qKey(it)] < DAY);
  const open = items.filter(it => !isDone(it));
  $('qcount').textContent = open.length ? String(open.length) : '';
  const sig = JSON.stringify([data && data.md, Object.keys(answered), qOpen, !!(await kvGet('config'))]);
  if (!force && sig === qShown) return;  // unchanged: leave the list alone, he may be typing in it
  qShown = sig;
  qview.textContent = '';
  const add = (parent, tag, cls, txt) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (txt) el.textContent = txt;
    parent.appendChild(el);
    return el;
  };
  if (!items.length) {
    add(qview, 'p', 'empty', !data ? 'Loading the questions…' : 'No open questions.');
    return;
  }
  let group = null;
  for (const it of items) {
    if (it.title !== group) { group = it.title; add(qview, 'h2', '', it.title); }
    const key = qKey(it), done = isDone(it);
    const card = add(qview, 'div', 'q' + (done ? ' done' : ''));
    add(card, 'p', '', it.q);
    if (done) { add(card, 'div', 'note', it.onPc ? 'Answered on the PC' : 'Sent · leaves the list once the PC has worked it in'); continue; }
    if (qOpen !== key) {
      add(card, 'div', 'note', 'Tap to answer');
      card.onclick = () => { qOpen = key; renderQuestions(); };
      continue;
    }
    const box = add(card, 'textarea');
    box.placeholder = 'Your answer…';
    box.value = localStorage.getItem('qdraft:' + key) || '';
    const row = add(card, 'div', 'row');
    const go = add(row, 'button', 'go', 'Send answer'), drop = add(row, 'button', 'drop', 'Drop');
    go.type = drop.type = 'button';
    go.disabled = !box.value.trim();
    box.oninput = () => { localStorage.setItem('qdraft:' + key, box.value); go.disabled = !box.value.trim(); };
    go.onclick = () => sendAnswer(it, box.value.trim());
    drop.onclick = () => { if (confirm('Drop this question without answering?')) sendAnswer(it, null); };
    setTimeout(() => box.focus(), 0);
  }
}

async function sendAnswer(it, answer) {
  const body = `Answer to an open question of [[${it.title}]]\n\nQuestion: ${it.q}\n\n` +
               (answer === null ? 'Drop this question.' : 'Answer: ' + answer) + '\n';
  await outboxAdd({ name: stamp() + ' phone answer.md', blob: new Blob([body], { type: 'text/markdown' }), created: Date.now() });
  const answered = (await kvGet('answered')) || {};
  answered[qKey(it)] = Date.now();
  await kvSet('answered', answered);
  localStorage.removeItem('qdraft:' + qKey(it));
  qOpen = null;
  renderQuestions();
  kick();
}

async function loadQuestions() {
  const cfg = await kvGet('config');
  if (cfg) {
    try {
      const r = await fetch(`https://api.github.com/repos/${cfg.repo}/contents/Questions.md?ref=main`,
        { headers: { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' });
      if (r.ok || r.status === 404) {
        const md = r.ok ? await r.text() : '';
        await kvSet('questions', { md, at: Date.now() });
        const keys = new Set(parseQuestions(md).map(qKey)), answered = (await kvGet('answered')) || {};
        for (const k of Object.keys(answered)) if (!keys.has(k)) delete answered[k];  // the PC has worked it in
        await kvSet('answered', answered);
      }
    } catch (e) {}  // offline: the last list stays
  }
  return renderQuestions();
}

function showTab(questions) {
  text.hidden = $('actions').hidden = questions;
  qview.hidden = !questions;
  $('tabDump').classList.toggle('on', !questions);
  $('tabQ').classList.toggle('on', questions);
  if (questions) { renderQuestions(true); loadQuestions(); } else text.focus();
}
$('tabDump').onclick = () => showTab(false);
$('tabQ').onclick = () => showTab(true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadQuestions(); });
setInterval(() => { if (!document.hidden) loadQuestions(); }, 60000);

// ---- install as an app: shown only while running in a browser tab
let installPrompt = null;
const installed = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; $('install').hidden = installed(); });
addEventListener('appinstalled', () => { $('install').hidden = true; });
$('install').hidden = installed();
$('install').onclick = async () => {
  if (installPrompt) {
    installPrompt.prompt();
    await installPrompt.userChoice.catch(() => {});
    installPrompt = null;
    return;
  }
  alert('To install: open the browser menu (⋮ or ≡) and choose "Add to Home screen" or "Install app".\n\n' +
        'If the menu has neither, choose "Open in Chrome" first and install from there.');
};

// ---- start
(async function start() {
  if ('serviceWorker' in navigator) {
    try { swReg = await navigator.serviceWorker.register('sw.js'); } catch (e) {}
    try {  // background retries with the app closed; the browser decides how often (installed app only)
      if (swReg && 'periodicSync' in swReg) await swReg.periodicSync.register('flush', { minInterval: 15 * 60 * 1000 });
    } catch (e) {}
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  await saveRecording();  // a recording the app was killed in the middle of

  const m = location.hash.match(/^#setup=(.+)$/);  // the link from the PC's setup QR code
  if (m) {
    history.replaceState(null, '', location.pathname + location.search);
    try {
      const c = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')));
      $('setup').hidden = false;
      $('repo').value = c.r;
      await connect(c.r, c.t, c.b || 'inbox');
    } catch (e) { showSetup(); }
  } else if (!(await kvGet('config'))) {
    showSetup();
  }
  await kick();
  const params = new URLSearchParams(location.search);
  if (params.has('voice')) startRec();
  if (params.get('tab') === 'questions') showTab(true); else loadQuestions();
})();
</script>
</body>
</html>
